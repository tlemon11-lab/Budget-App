<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget App</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 50px;
      margin-bottom: 20px;
    }

    input, select {
      width: 90%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
    }

    button {
      width: 95%;
      padding: 15px;
      font-size: 18px;
      background: black;
      color: white;
      border: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1 id="remaining">$0</h1>

<input type="date" id="date">

<select id="week">
  <option value="1">Week 1</option>
  <option value="2">Week 2</option>
  <option value="3">Week 3</option>
  <option value="4">Week 4</option>
  <option value="5">Week 5</option>
</select>

<input type="text" id="category" placeholder="Category">
<input type="number" id="amount" placeholder="Amount">

<button onclick="addExpense()">Add Expense</button>

<script>
const url = "https://script.google.com/macros/s/AKfycbzXHG6Yk2Pepdtvh16JdLzOUr54RP80MXuB-qeEWo4ltrc8I7jYOYgZ4UdQmyPpwg2U8g/exec";

function loadRemaining() {
  fetch(url)
    .then(res => res.json())
    .then(data => {
      document.getElementById("remaining").innerText = "$" + data.remaining;
    });
}

function addExpense() {
  const data = {
    date: document.getElementById("date").value,
    week: document.getElementById("week").value,
    category: document.getElementById("category").value,
    amount: document.getElementById("amount").value
  };

  fetch(url, {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(() => {
    loadRemaining();
    alert("Added!");
  });
}

loadRemaining();
</script>

</body>
</html>
