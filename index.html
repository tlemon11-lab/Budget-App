<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget App</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 20px;
    }

    input, select {
      width: 90%;
      padding: 14px;
      margin: 10px 0;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 95%;
      padding: 16px;
      font-size: 20px;
      background: black;
      color: white;
      border: none;
      border-radius: 10px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<h1 id="remaining">$0</h1>

<input type="date" id="date">

<select id="week">
  <option value="1">Week 1</option>
  <option value="2">Week 2</option>
  <option value="3">Week 3</option>
  <option value="4">Week 4</option>
  <option value="5">Week 5</option>
</select>

<input type="text" id="category" placeholder="Category">
<input type="number" id="amount" placeholder="Amount">

<button onclick="addExpense()">Add Expense</button>

<script>
const url = "https://script.google.com/macros/s/AKfycbxPPJiFJzURsMXxVze9p2EOjTTcTZxBy1EWUmYcEWt7pw0ByB6WGyYj6EyUH2qP2vzi2g/exec";

// 🔹 Load remaining budget
function loadRemaining() {
  fetch(url)
    .then(res => res.json())
    .then(data => {
      document.getElementById("remaining").innerText = "$" + data.remaining;
    })
    .catch(err => {
      console.error("GET error:", err);
    });
}

// 🔹 Add expense
function addExpense() {
  const params = new URLSearchParams();

  params.append("date", document.getElementById("date").value);
  params.append("week", document.getElementById("week").value);
  params.append("category", document.getElementById("category").value);
  params.append("amount", document.getElementById("amount").value);

  fetch(url, {
    method: "POST",
    mode: "no-cors",
    body: params.toString(), // important change
    headers: {
      "Constent-Type": "application/x-www-form-urlencoded"
    }
  })
  .then(() => {
    alert("Added!");

    document.getElementById("category").value = "";
    document.getElementById("amount").value = "";

    setTimeout(loadRemaining, 500);
  })
  .catch(err => {
    console.error("POST error:", err);
    alert("Error adding expense");
  });
}

// Load on startup
loadRemaining();
</script>
