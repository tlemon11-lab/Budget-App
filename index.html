<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget App</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 20px;
    }

    input, select {
      width: 90%;
      padding: 14px;
      margin: 10px 0;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 95%;
      padding: 16px;
      font-size: 20px;
      background: black;
      color: white;
      border: none;
      border-radius: 10px;
      margin-top: 15px;
    }
    <div id="statusMessage" style="
      margin-top:10px;
      font-size:18px;
      color:green;
      font-weight:bold;
"></div>
  </style>
</head>
<body>

<h1 id="remaining">$0</h1>

<form id="expenseForm"
  action="https://script.google.com/macros/s/AKfycbw_I869UULr94Zh9qedxLX_kJgiqMeaSYyJnIIWYq0KuaNeQlfuzKMpm5K9MWRZDUljZA/exec"
  method="POST"
  target="hiddenFrame">

  <input type="date" name="date" required>

  <select name="week">
    <option value="1">Week 1</option>
    <option value="2">Week 2</option>
    <option value="3">Week 3</option>
    <option value="4">Week 4</option>
    <option value="5">Week 5</option>
  </select>

  <input type="text" name="category" placeholder="Category" required>
  <input type="number" name="amount" placeholder="Amount" required>

  <button type="submit">Add Expense</button>
</form>

<iframe name="hiddenFrame" style="display:none;"></iframe>

<script>
const url = "https://script.google.com/macros/s/AKfycbw_I869UULr94Zh9qedxLX_kJgiqMeaSYyJnIIWYq0KuaNeQlfuzKMpm5K9MWRZDUljZA/exec";

// Load remaining total
function loadRemaining() {
  fetch(url)
    .then(res => res.json())
    .then(data => {
      document.getElementById("remaining").innerText = "$" + data.remaining;
    })
    .catch(err => {
      console.error("GET error:", err);
    });
}

// When form submits
document.getElementById("expenseForm").addEventListener("submit", function() {
  
  const msg = document.getElementById("statusMessage");
msg.innerText = "Added!";
  
  setTimeout(() => {
    msg.innerText = "";
}, 1500);
  
  document.getElementById("expenseForm").reset();

  setTimeout(() => {
    loadRemaining();
  }, 300);

});
// Initial load
loadRemaining();
</script>

</body>
</html>
