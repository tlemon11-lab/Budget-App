<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weekly Budget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      margin: 0;
      flex-direction: column;
    }
    h1 {
      font-size: 4rem;
      margin: 0;
    }
    p {
      font-size: 1.5rem;
      opacity: 0.8;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <h1 id="balance">Loading...</h1>
  <p>Remaining This Week</p>

  <script>
    async function fetchBalance() {
      try {
        const response = await fetch('https://script.google.com/macros/s/AKfycbwhhKeEZAiCMG9fZllA_eXveWj2tWCr06jvOqtXDxB9f5-_fE2Z18j1hoWgbVkCDnJb/exec'); // replace with /exec URL
        const data = await response.json();
        document.getElementById('balance').textContent = data.remaining;
      } catch (err) {
        document.getElementById('balance').textContent = 'Error';
        console.error(err);
      }
    }

    fetchBalance();
    // Optional: refresh every 5 minutes
    setInterval(fetchBalance, 300000);
  </script>
</body>
</html>
