<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget App</title>
  <style>
    body { font-family: Arial; text-align: center; padding: 20px; background: #f5f5f5; }
    h1 { font-size: 60px; margin-bottom: 20px; }
    input, select { width: 90%; padding: 14px; margin: 10px 0; font-size: 18px; border-radius: 8px; border: 1px solid #ccc; }
    button { width: 95%; padding: 16px; font-size: 20px; background: black; color: white; border: none; border-radius: 10px; margin-top: 15px; }
  </style>
</head>
<body>
<h1 id="remaining">...</h1>
<form id="expenseForm">
  <input type="date" name="date" required>
  <select name="week">
    <option value="1">Week 1</option>
    <option value="2">Week 2</option>
    <option value="3">Week 3</option>
    <option value="4">Week 4</option>
    <option value="5">Week 5</option>
  </select>
  <input type="text" name="category" placeholder="Category" required>
  <input type="number" name="amount" placeholder="Amount" step="0.01" required>
  <button type="submit">Add Expense</button>
  <div id="statusMessage" style="margin-top:10px;font-size:18px;color:green;font-weight:bold;"></div>
</form>
<script>
const url = "YOUR_DEPLOYED_URL_HERE";

const dateInput = document.querySelector('input[name="date"]');
const today = new Date().toISOString().split('T')[0];
dateInput.value = today;

function loadRemaining() {
  fetch(url + "?t=" + Date.now())
    .then(res => res.json())
    .then(data => {
      document.getElementById("remaining").innerText = "$" + data.remaining;
    })
    .catch(err => console.error("GET error:", err));
}

document.getElementById("expenseForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const form = document.getElementById("expenseForm");
  const formData = new FormData(form);
  const params = new URLSearchParams();
  for (const [key, value] of formData.entries()) {
    params.append(key, value);
  }

  fetch(url, { method: "POST", body: params })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        const msg = document.getElementById("statusMessage");
        msg.innerText = "Added!";
        setTimeout(() => { msg.innerText = ""; }, 1500);
        form.reset();
        dateInput.value = today;
        setTimeout(() => { loadRemaining(); }, 1500);
      }
    })
    .catch(err => console.error("POST error:", err));
});

loadRemaining();
</script>
</body>
</html>
